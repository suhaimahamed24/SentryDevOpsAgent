name: Build and Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: 'sentrydevopsagent'
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'SentryDevOpsAgent/SentryDevOpsAgent.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔐 Login to Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ⚙️ Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 📦 Restore
      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # 🔨 Build
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # 🚀 Publish (IMPORTANT FIX)
      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} \
              -c Release \
              -o ./publish \
              /p:UseAppHost=false \
              /p:GenerateRuntimeConfigurationFiles=true

      # 🔍 Verify output (KEEP THIS UNTIL WORKS)
      - name: Verify publish output
        run: |
          echo "===== PUBLISH CONTENT ====="
          ls -R ./publish

      # 📦 Zip package (CRITICAL)
      - name: Archive publish output
        run: |
          cd publish
          zip -r ../release.zip .

      # ☁️ Deploy to Azure Function
      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
